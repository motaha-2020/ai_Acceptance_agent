name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # API/db/worker tests start an embedded PostgreSQL 16 (no service container needed); AI tests are offline.
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        run: docker buildx build -f apps/api/Dockerfile -t acceptance/api:ci --load .
      - name: Build worker image
        run: docker buildx build -f apps/worker/Dockerfile -t acceptance/worker:ci --load .
      # A build that compiles can still crash at start when a workspace package is missing from the
      # image (the first P6 deploy rolled back on "Cannot find package '@acceptance/report'").
      # Load each app's code and every runtime dependency inside the image, without starting it.
      - name: Smoke-check api image imports
        run: >-
          docker run --rm --entrypoint node -w /app/apps/api acceptance/api:ci --input-type=module -e
          "const p = JSON.parse((await import('node:fs')).readFileSync('package.json', 'utf8'));
          for (const d of Object.keys(p.dependencies ?? {})) await import(d);
          await import('/app/apps/api/dist/app.js'); console.log('api imports ok')"
      - name: Smoke-check worker image imports
        run: >-
          docker run --rm --entrypoint node -w /app/apps/worker acceptance/worker:ci --input-type=module -e
          "const p = JSON.parse((await import('node:fs')).readFileSync('package.json', 'utf8'));
          for (const d of Object.keys(p.dependencies ?? {})) await import(d);
          await import('/app/apps/worker/dist/index.js'); await import('/app/apps/worker/dist/ai-providers.js'); console.log('worker imports ok')"
