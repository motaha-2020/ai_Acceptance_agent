# Production stack (single Hetzner VPS). Run through infra/scripts/deploy.sh, or by hand:
#   docker compose -p acceptance --env-file /opt/acceptance/.env -f infra/docker-compose.prod.yml up -d
#
# Security: Docker publishes ports around ufw, so ONLY caddy publishes ports (80/443).
# PostgreSQL and Redis sit on an internal network with no route out; MinIO/API are reachable only
# through Caddy. Secrets come from /opt/acceptance/.env (chmod 600, never committed).

name: acceptance

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://acceptance:${POSTGRES_PASSWORD:?}@postgres:5432/acceptance
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  QUEUE_PREFIX: acceptance
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${PUBLIC_URL:?}
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:-photos}
  AI_PROVIDER: ${AI_PROVIDER:-claude}
  AI_MODEL: ${AI_MODEL:-}
  AI_CONCURRENCY: ${AI_CONCURRENCY:-2}
  AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
  AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-20}
  AUTONOMY_ENABLED: "false"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${DOMAIN:-:80}
      S3_BUCKET: ${S3_BUCKET:-photos}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
    logging: *logging

  api:
    image: acceptance/api:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_BASE_URL: ${PUBLIC_URL:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      EMBEDDED_WORKER: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?}
      NODE_OPTIONS: --max-old-space-size=768
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  worker:
    image: acceptance/worker:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      <<: *app-env
      # Only the worker talks to AI vendors, so only the worker gets the keys.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_OPTIONS: --max-old-space-size=768
    # data: postgres/redis/minio; egress: outbound HTTPS to the AI vendors.
    networks: [data, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_DB: acceptance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB", "-c", "max_connections=100"]
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d acceptance"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires noeviction; AOF keeps queued jobs across restarts.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 384mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *logging

  minio:
    # Upstream minio/minio images are no longer published; pgsty/minio is a maintained community build
    # of the same server (same CLI, env and S3 API). Pinned; bump deliberately.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/data
    # edge: Caddy proxies presigned GETs; data: API/worker read and write.
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  # One-shot: bucket (private) + a least-privilege app user for the API/worker.
  minio-init:
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-photos}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET" >/dev/null
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$S3_BUCKET" "$$S3_BUCKET" > /tmp/app-policy.json
        mc admin policy create local acceptance-app /tmp/app-policy.json >/dev/null
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null
        mc admin policy attach local acceptance-app --user "$$S3_ACCESS_KEY" >/dev/null 2>&1 || true
        echo "minio-init: bucket $$S3_BUCKET and app user ready"
    networks: [data]
    logging: *logging

networks:
  edge: {}
  egress: {}
  data:
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
